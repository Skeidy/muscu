<script>
const K="fonte-v2",D=["Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi","Dimanche"];
const E=[["Développé couché","Pectoraux","Allongé, descends la barre à la poitrine puis pousse, omoplates serrées, pieds au sol."],["Développé incliné haltères","Haut des pectoraux","Banc incliné, pousse les haltères vers le haut sans claquer les coudes."],["Pompes","Pectoraux","Corps gainé, descends la poitrine près du sol et repousse."],["Écartés poulie","Pectoraux","Bras légèrement fléchis, ramène les mains devant toi en contractant la poitrine."],["Tractions","Dos","Tire-toi jusqu’à passer le menton au-dessus de la barre, sans élan."],["Rowing barre","Dos","Buste penché, tire la barre vers le nombril en gardant le dos plat."],["Tirage vertical","Dos","Tire la barre vers le haut de la poitrine en serrant les omoplates."],["Soulevé de terre","Dos / jambes","Dos neutre, pousse le sol avec les jambes et verrouille les hanches en haut."],["Squat","Jambes","Barre sur les trapèzes, descends cuisses parallèles au sol, genoux dans l’axe des pieds."],["Presse à cuisses","Jambes","Pieds à largeur d’épaules, descends sans décoller le bas du dos."],["Fentes","Jambes","Grand pas en avant, descends le genou arrière vers le sol, remonte."],["Leg curl","Ischios","Plie les jambes en contrôlant la descente."],["Hip thrust","Fessiers","Dos sur le banc, pousse les hanches vers le haut et serre les fessiers."],["Mollets debout","Mollets","Monte sur la pointe des pieds, marque une pause en haut."],["Développé militaire","Épaules","Pousse la barre au-dessus de la tête sans cambrer le dos."],["Élévations latérales","Épaules","Monte les haltères sur les côtés jusqu’à hauteur d’épaules."],["Curl biceps","Biceps","Coudes collés au corps, monte la charge sans balancer."],["Extensions triceps","Triceps","Coudes fixes, tends les bras vers le bas à la poulie."],["Dips","Triceps / pecs","Descends jusqu’à 90° aux coudes et repousse."],["Gainage","Abdos","Appui sur les avant-bras, corps aligné, tiens la position."],["Crunch","Abdos","Enroule le buste vers les genoux sans tirer sur la nuque."],["Course sur tapis","Cardio","Cours à une allure régulière adaptée à ton niveau."],["Vélo","Cardio","Pédale à intensité modérée ou soutenue selon ton objectif."],["Rameur","Cardio","Pousse avec les jambes, puis tire avec les bras en gardant le dos neutre."]];
const F=[["Poulet",165],["Riz cuit",130],["Pâtes cuites",150],["Œuf",143],["Pain",265],["Flocons d’avoine",370],["Banane",89],["Pomme",52],["Lait",46],["Yaourt nature",60],["Thon",130],["Saumon",208],["Bœuf haché",250],["Pommes de terre",77],["Brocoli",34],["Huile d’olive",884],["Fromage",350],["Whey",380],["Beurre de cacahuète",590],["Amandes",580],["Dinde",135],["Steak haché 5%",137],["Crevettes",99],["Skyr",60],["Fromage blanc 0%",45],["Yaourt grec",120],["Quinoa cuit",120],["Lentilles cuites",116],["Haricots rouges cuits",127],["Avocat",160],["Tomate",18],["Salade verte",15],["Pain complet",247],["Wrap de blé",310],["Patate douce cuite",90],["Champignons",22],["Carottes",41],["Concombre",15]];
const MA=[[31,0,3.6],[2.7,28,.3],[5,30,1],[13,1,10],[9,49,3],[13,60,7],[1,23,.3],[.3,14,.2],[3.4,5,1.5],[4,6,3],[25,0,1],[20,0,13],[26,0,17],[2,17,.1],[2.8,7,.4],[0,0,100],[25,1,28],[80,8,6],[25,20,50],[21,22,50],[29,0,1.5],[21,0,5],[24,0,.3],[10,4,.2],[8,4,.2],[8,4,8],[4.4,21,1.9],[9,20,.4],[8.7,22,.5],[2,9,15],[.9,3.9,.2],[1.4,2.9,.2],[13,41,4.2],[9,52,8],[2,21,.1],[3.1,3.3,.3],[.9,10,.2],[.7,3.6,.1]];
const MS=["Tour de taille","Poitrine","Bras","Cuisse","Hanches"];
const MEALS=[{n:"Skyr, flocons d’avoine & banane",k:420,m:[30,58,7],tag:"Petit-déjeuner",desc:"Un bol rapide, riche en protéines et en glucides."},{n:"Poulet, riz & légumes",k:560,m:[45,66,11],tag:"Déjeuner",desc:"Un repas complet avec une bonne portion de protéines."},{n:"Wrap de dinde et crudités",k:480,m:[38,51,12],tag:"Déjeuner",desc:"Pratique à préparer, avec une sauce au fromage blanc."},{n:"Saumon, pommes de terre & brocoli",k:610,m:[40,55,22],tag:"Dîner",desc:"Protéines, féculents et bons lipides."},{n:"Omelette 3 œufs & pain complet",k:480,m:[29,42,20],tag:"Dîner",desc:"Simple, rassasiant et facile à adapter."},{n:"Fromage blanc, fruits & amandes",k:300,m:[22,30,10],tag:"Collation",desc:"Une collation fraîche avec protéines et fibres."},{n:"Steak 5%, patate douce & salade",k:570,m:[42,58,15],tag:"Déjeuner",desc:"Une assiette généreuse et équilibrée."},{n:"Pâtes au thon et tomate",k:520,m:[37,68,9],tag:"Dîner",desc:"Un plat facile à faire avec des ingrédients courants."}];
const PU=["Développé couché","Développé militaire","Extensions triceps"],PL=["Tractions","Rowing barre","Curl biceps"],LG=["Squat","Presse à cuisses","Mollets debout"],FB=["Squat","Développé couché","Rowing barre","Développé militaire","Gainage"],UP=["Développé couché","Tractions","Développé militaire","Curl biceps","Extensions triceps"],LO=["Squat","Soulevé de terre","Fentes","Mollets debout","Crunch"];
const PG={"Push / Pull / Legs":[PU,PL,LG,[],PU,PL,[]],"Full body (3 jours)":[FB,[],FB,[],FB,[],[]],"Haut / Bas (4 jours)":[UP,LO,[],UP,LO,[],[]]};
let S={p:{s:"h",a:"",h:"",w:"",act:1.55,obj:"maintien"},plan:[[],[],[],[],[],[],[]],done:{},water:{},wok:{},meals:{},wt:[],ms:[],logs:{},prefs:{},custom:[],sleep:{},photos:[]};
try{const r=localStorage.getItem(K);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const sv=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const tk=d=>{d=d||new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const di=()=>(new Date().getDay()+6)%7,T=()=>tk();
const wk=()=>{const m=new Date();m.setDate(m.getDate()-di());return D.map((_,i)=>{const x=new Date(m);x.setDate(m.getDate()+i);return tk(x)})};
const all=()=>E.concat(S.custom.map(n=>[n,"Perso","Exercice ajouté par toi."]));
const val=id=>($("#"+id)||{}).value;
let view="home",open=-1,pm=MS[0],pe="";
function toast(m){const t=$("#t");t.textContent=m;t.style.display="block";clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display="none",2200)}
function ring(p,a,b,c,x){return`<div class="ring ${x||""}" style="--p:${Math.max(0,Math.min(100,p||0))}%${c?";--c:"+c:""}"><div><strong>${a}</strong><small>${b}</small></div></div>`}
function adv(){let n=0;for(let i=1;i<=7;i++){const x=new Date();x.setDate(x.getDate()-i);if(S.done[tk(x)])n++;else break}const s=S.sleep[T()];return n>=3?`Tu t’es entraîné ${n} jours de suite : prends un jour de repos.`:s&&s<6?"Nuit courte : séance plus légère, ou repos.":S.done[T()]?"Séance faite, pense à bien manger et à bien dormir.":"Tu peux t’entraîner normalement aujourd’hui."}
function focusFor(ex){const t=new Set();ex.forEach(n=>{const e=all().find(x=>x[0]===n),g=(e?e[1]:"").toLowerCase();
if(g.includes("pector"))t.add("Pecs");if(g.includes("dos"))t.add("Dos");if(/jambe|ischio|fessier|mollet/.test(g))t.add("Jambes");if(g.includes("épaule"))t.add("Épaules");if(/biceps|triceps/.test(g))t.add("Bras");if(g.includes("abdo"))t.add("Abdos");if(g.includes("cardio"))t.add("Cardio");if(g==="perso")t.add("Perso")});return[...t]}
function mac(d,c){const m=(S.meals[d]||[]).reduce((a,x)=>x.m?[a[0]+x.m[0],a[1]+x.m[1],a[2]+x.m[2]]:a,[0,0,0]),g=c?Math.round((c.kcal-4*c.P-9*c.L)/4):0;return`Protéines ${m[0]}${c?"/"+c.P:""} g · Glucides ${m[1]}${c?"/"+g:""} g · Lipides ${m[2]}${c?"/"+c.L:""} g`}
function photo(f){if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement("canvas"),w=360;c.width=w;c.height=Math.round(im.height*w/im.width);c.getContext("2d").drawImage(im,0,0,c.width,c.height);S.photos.push({d:T(),img:c.toDataURL("image/jpeg",.6)});sv();render();toast("Photo ajoutée")};im.src=r.result};r.readAsDataURL(f)}
function calc(){const p=S.p;if(!p.w||!p.h||!p.a)return null;const b=10*p.w+6.25*p.h-5*p.a+(p.s==="h"?5:-161);return{kcal:Math.round(b*p.act+({perte:-400,maintien:0,prise:300}[p.obj])),eau:Math.round(p.w*35),P:Math.round(p.w*(p.obj==="prise"?2:1.8)),L:Math.round(p.w*.9)}}
const kc=d=>(S.meals[d]||[]).reduce((a,m)=>a+m.k,0);
function chart(pts,u){if(pts.length<2)return`<p class="sub">Ajoute au moins 2 valeurs pour voir la courbe.</p>`;
const v=pts.map(p=>p.v),lo=Math.min(...v),hi=Math.max(...v),r=hi-lo||1,x=i=>30+i*(270/(pts.length-1)),y=a=>110-(a-lo)/r*90;
return`<svg class="ch" viewBox="0 0 320 135" role="img" aria-label="Courbe d’évolution"><polyline fill="none" stroke="var(--pl)" stroke-width="2.5" stroke-linejoin="round" points="${pts.map((p,i)=>x(i)+","+y(p.v)).join(" ")}"/>${pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.v)}" r="3.5" fill="var(--pl)"/>`).join("")}<text x="2" y="24" font-size="11" fill="var(--mu)">${hi}</text><text x="2" y="114" font-size="11" fill="var(--mu)">${lo}</text><text x="30" y="130" font-size="11" fill="var(--mu)">${pts[0].d.slice(5)}</text><text x="300" y="130" font-size="11" text-anchor="end" fill="var(--mu)">${pts[pts.length-1].d.slice(5)} (${u})</text></svg>`}
function pref(n){const p=S.prefs[n]||{};const f=(id,l,v,s)=>`<div style="flex:1;min-width:70px"><span class="lab">${l}</span><input id="${id}" type="number" inputmode="decimal" step="${s}" value="${v??""}"></div>`;
return`<div class="row" style="align-items:flex-end">${f("pk","Poids (kg)",p.kg,.5)}${f("pb","Cran du banc",p.banc,1)}${f("ps","Séries",p.ser,1)}${f("pr","Répétitions",p.rep,1)}</div><button data-a="pref" data-n="${esc(n)}" style="margin-top:10px;width:100%">Enregistrer mes préférences</button>`}
function home(){const c=calc(),d=T(),pl=S.plan.filter(x=>x.length).length,dn=wk().filter(x=>S.done[x]).length,ex=S.plan[di()],w=S.water[d]||0,k=kc(d);
return`<h1>Salut 👋</h1><p class="sub">${new Date().toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"})}</p>

<div class="card ${S.done[d]?"":"today"}"><div class="row sp"><h2 style="margin:0">Séance du jour</h2>${S.done[d]?`<span class="ok">Faite ✓</span>`:""}</div>${ex.length?`<div class="focus-tags" style="margin-top:12px">${focusFor(ex).map(x=>`<span class="focus-tag">${esc(x)}</span>`).join("")||`<span class="focus-tag">Renforcement</span>`}</div><div class="hs">${ex.map(n=>{const p=S.prefs[n];return`<div class="xc"><b>${esc(n)}</b><small>${p&&p.kg?p.kg+" kg · "+(p.ser||"?")+"×"+(p.rep||"?"):"à régler"}</small></div>`}).join("")}</div>`:`<p class="sub" style="margin-top:8px">Jour de repos (ou planning à remplir dans Séance).</p>`}</div>
