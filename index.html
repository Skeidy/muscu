<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>

*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}

h1,h2,h3{font-family:"Barlow Condensed","Arial Narrow",sans-serif;margin:0}
h1{font-size:34px}h2{font-size:23px}h3{font-size:19px}
.sub,.lab{color:var(--mu)}.sub{margin:2px 0 14px}.lab{font-size:13px;display:block;margin-top:8px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}
.big{font-family:"Barlow Condensed",sans-serif;font-size:44px;font-weight:700;line-height:1}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--ln);border-radius:8px;padding:10px;width:100%}
.row>input,.row>select{flex:1;min-width:90px}
:is(input,select,button):focus-visible{outline:3px solid var(--pl);outline-offset:2px}
button{font:inherit;font-weight:600;border:0;border-radius:8px;padding:10px 14px;cursor:pointer;background:var(--pl);color:var(--pi)}
button.g{background:transparent;color:var(--mu);padding:6px 8px}button.o{background:transparent;color:var(--pl);border:1.5px solid var(--pl)}
.chip{display:inline-flex;gap:4px;align-items:center;background:var(--bg);border:1px solid var(--ln);border-radius:20px;padding:2px 4px 2px 10px;margin:3px 3px 0 0;font-size:14px}
.chip button{padding:2px 8px}
.item{width:100%;text-align:left;background:transparent;color:var(--ink);border-bottom:1px solid var(--ln);border-radius:0;padding:12px 0;display:flex;justify-content:space-between}
.item small{color:var(--mu);font-weight:500}
.bar{height:10px;background:var(--bg);border-radius:5px;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:var(--pl)}
.ok{color:var(--pl);font-weight:600}.today{border-color:var(--pl)}
svg.ch{width:100%;height:auto}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--sf);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:transparent;color:var(--mu);border-radius:0;padding:14px 0;font-size:12.5px}
nav button[aria-current="page"]{color:var(--pl);box-shadow:inset 0 3px 0 var(--pl)}
#t{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;display:none;z-index:5}

.brandbar{display:flex;align-items:center;gap:9px;margin:2px 3px 18px}
.brandmark{width:30px;height:30px;border-radius:10px;background:var(--pl);color:#14200c;display:grid;place-items:center;font-weight:950;font-size:19px}
.brandname{font-weight:950;letter-spacing:2px;font-size:13px}
.brandtag{font-size:9px;letter-spacing:1.3px;color:var(--mu);border-left:1px solid var(--ln);padding-left:9px}
/* Fonte UI refresh */
:root{--bg:#0b1018;--sf:#141d29;--ink:#f3f6fb;--mu:#9aa8ba;--ln:#263447;--pl:#9be15d;--pi:#10180b;--dg:#ff7777;color-scheme:dark}
body{background:radial-gradient(ellipse at 12% -8%,rgba(155,225,93,.13),transparent 34rem),radial-gradient(ellipse at 100% 15%,rgba(66,130,255,.10),transparent 30rem),var(--bg);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
main{max-width:680px;padding:22px 16px 28px}
h1{font-family:Inter,system-ui,sans-serif;font-size:clamp(30px,8vw,38px);font-weight:850;letter-spacing:-1.4px}
h2{font-family:Inter,system-ui,sans-serif;font-size:19px;font-weight:800;letter-spacing:-.35px}
h3{font-family:Inter,system-ui,sans-serif;font-size:16px;font-weight:750}
.sub{color:var(--mu);font-size:14px}
.card{position:relative;background:linear-gradient(145deg,rgba(25,37,53,.98),rgba(17,26,39,.98));border:1px solid rgba(145,165,190,.13);border-radius:21px;padding:18px;margin-bottom:14px;box-shadow:0 10px 28px rgba(0,0,0,.13)}
.card h2,.card h3{margin-bottom:10px}
.big{font-family:Inter,system-ui,sans-serif;font-size:38px;font-weight:850;letter-spacing:-1.4px}
.lab{font-size:11px;text-transform:uppercase;letter-spacing:1px;font-weight:750;color:#9eacbf}
input,select,textarea{background:#0d1520;border:1px solid #2a3a50;border-radius:13px;padding:13px 12px;min-height:46px;color:var(--ink)}
input::placeholder{color:#6f7f93}
button{border-radius:13px;padding:12px 16px;font-weight:750;transition:transform .15s,filter .15s}
button:active{transform:scale(.97)}
button:not(.g):not(.o){background:linear-gradient(135deg,#b6f27b,#8acb4b);color:#14200c;box-shadow:0 5px 16px rgba(155,225,93,.15)}
button.o{border:1px solid rgba(155,225,93,.55);color:var(--pl);background:rgba(155,225,93,.07)}
button.g{color:#aab7c8}
.item{background:rgba(255,255,255,.025);border:1px solid rgba(145,165,190,.12);border-radius:14px;padding:14px;margin:7px 0;align-items:center;gap:12px}
.item:after{content:"›";font-size:22px;color:var(--pl);line-height:1}
.item small{font-size:12px}
.bar{height:8px;background:#273447;border-radius:99px;margin-top:9px}
.bar i{background:linear-gradient(90deg,#8bcf4e,#c5f58b);border-radius:99px}
.today{border-color:rgba(155,225,93,.65);box-shadow:0 0 0 1px rgba(155,225,93,.12),0 12px 30px rgba(0,0,0,.18)}
.chip{background:#202d3e;border-color:#34445a;border-radius:12px;padding:6px 7px 6px 11px}
nav{left:10px;right:10px;bottom:calc(9px + env(safe-area-inset-bottom,0px));border:1px solid rgba(145,165,190,.18);border-radius:22px;background:rgba(18,27,40,.94);backdrop-filter:blur(20px);box-shadow:0 12px 40px rgba(0,0,0,.38);padding:5px;gap:3px}
nav button{min-height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:7px 0;color:#8493a8;font-size:10px;border-radius:15px}
nav button .nav-ico{width:22px;height:22px;display:block;font-size:23px;line-height:22px}
nav button[aria-current="page"]{color:var(--pl);background:rgba(155,225,93,.11);box-shadow:none}
#t{border:1px solid rgba(255,255,255,.12);border-radius:14px;box-shadow:0 8px 30px #0008}
.week-strip{display:flex;gap:11px;overflow-x:auto;padding:2px 2px 12px;scroll-snap-type:x mandatory;scrollbar-width:none}
.week-strip::-webkit-scrollbar{display:none}
.week-strip>.card{flex:0 0 82%;max-width:310px;scroll-snap-align:start;margin:0}
.day-card{min-width:230px;max-width:270px;flex:0 0 78%;scroll-snap-align:start}
.card .row{row-gap:10px}
.card .row>input,.card .row>select{min-width:0}
figure img{aspect-ratio:3/4;object-fit:cover}
@media(min-width:560px){main{padding:28px 22px}.week-strip>.card{flex-basis:45%}.day-card{flex-basis:30%}}

</style></head><body>
<main><div class="brandbar"><span class="brandmark">F</span><span class="brandname">FONTE</span><span class="brandtag">TRAINING LOG</span></div><div id="app"></div></main>
<nav id="nav"></nav><div id="t" role="status"></div>
<script>
const K="fonte-v2",D=["Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi","Dimanche"];
const E=[["Développé couché","Pectoraux","Allongé, descends la barre à la poitrine puis pousse, omoplates serrées, pieds au sol."],["Développé incliné haltères","Haut des pectoraux","Banc incliné, pousse les haltères vers le haut sans claquer les coudes."],["Pompes","Pectoraux","Corps gainé, descends la poitrine près du sol et repousse."],["Écartés poulie","Pectoraux","Bras légèrement fléchis, ramène les mains devant toi en contractant la poitrine."],["Tractions","Dos","Tire-toi jusqu’à passer le menton au-dessus de la barre, sans élan."],["Rowing barre","Dos","Buste penché, tire la barre vers le nombril en gardant le dos plat."],["Tirage vertical","Dos","Tire la barre vers le haut de la poitrine en serrant les omoplates."],["Soulevé de terre","Dos / jambes","Dos neutre, pousse le sol avec les jambes et verrouille les hanches en haut."],["Squat","Jambes","Barre sur les trapèzes, descends cuisses parallèles au sol, genoux dans l’axe des pieds."],["Presse à cuisses","Jambes","Pieds à largeur d’épaules, descends sans décoller le bas du dos."],["Fentes","Jambes","Grand pas en avant, descends le genou arrière vers le sol, remonte."],["Leg curl","Ischios","Plie les jambes en contrôlant la descente."],["Hip thrust","Fessiers","Dos sur le banc, pousse les hanches vers le haut et serre les fessiers."],["Mollets debout","Mollets","Monte sur la pointe des pieds, marque une pause en haut."],["Développé militaire","Épaules","Pousse la barre au-dessus de la tête sans cambrer le dos."],["Élévations latérales","Épaules","Monte les haltères sur les côtés jusqu’à hauteur d’épaules."],["Curl biceps","Biceps","Coudes collés au corps, monte la charge sans balancer."],["Extensions triceps","Triceps","Coudes fixes, tends les bras vers le bas à la poulie."],["Dips","Triceps / pecs","Descends jusqu’à 90° aux coudes et repousse."],["Gainage","Abdos","Appui sur les avant-bras, corps aligné, tiens la position."],["Crunch","Abdos","Enroule le buste vers les genoux sans tirer sur la nuque."]];
const F=[["Poulet",165],["Riz cuit",130],["Pâtes cuites",150],["Œuf",143],["Pain",265],["Flocons d’avoine",370],["Banane",89],["Pomme",52],["Lait",46],["Yaourt nature",60],["Thon",130],["Saumon",208],["Bœuf haché",250],["Pommes de terre",77],["Brocoli",34],["Huile d’olive",884],["Fromage",350],["Whey",380],["Beurre de cacahuète",590],["Amandes",580]];
const MS=["Tour de taille","Poitrine","Bras","Cuisse","Hanches"];
const MA=[[31,0,3.6],[2.7,28,.3],[5,30,1],[13,1,10],[9,49,3],[13,60,7],[1,23,.3],[.3,14,.2],[3.4,5,1.5],[4,6,3],[25,0,1],[20,0,13],[26,0,17],[2,17,.1],[2.8,7,.4],[0,0,100],[25,1,28],[80,8,6],[25,20,50],[21,22,50]];
const PU=["Développé couché","Développé militaire","Extensions triceps"],PL=["Tractions","Rowing barre","Curl biceps"],LG=["Squat","Presse à cuisses","Mollets debout"],FB=["Squat","Développé couché","Rowing barre","Développé militaire","Gainage"],UP=["Développé couché","Tractions","Développé militaire","Curl biceps","Extensions triceps"],LO=["Squat","Soulevé de terre","Fentes","Mollets debout","Crunch"];
const PG={"Push / Pull / Legs":[PU,PL,LG,[],PU,PL,[]],"Full body (3 jours)":[FB,[],FB,[],FB,[],[]],"Haut / Bas (4 jours)":[UP,LO,[],UP,LO,[],[]]};
let S={p:{s:"h",a:"",h:"",w:"",act:1.55,obj:"maintien"},plan:[[],[],[],[],[],[],[]],done:{},water:{},wok:{},meals:{},wt:[],ms:[],logs:{},prefs:{},custom:[],sleep:{},photos:[]};
try{const r=localStorage.getItem(K);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const sv=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const tk=d=>{d=d||new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const di=()=>(new Date().getDay()+6)%7,T=()=>tk();
const wk=()=>{const m=new Date();m.setDate(m.getDate()-di());return D.map((_,i)=>{const x=new Date(m);x.setDate(m.getDate()+i);return tk(x)})};
const all=()=>E.concat(S.custom.map(n=>[n,"Perso","Exercice ajouté par toi."]));
const val=id=>($("#"+id)||{}).value;
let view="home",open=-1,pm=MS[0],pe="";
function toast(m){const t=$("#t");t.textContent=m;t.style.display="block";clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display="none",2200)}
function adv(){let n=0;for(let i=1;i<=7;i++){const x=new Date();x.setDate(x.getDate()-i);if(S.done[tk(x)])n++;else break}const s=S.sleep[T()];return n>=3?`Tu t’es entraîné ${n} jours de suite : prends un jour de repos.`:s&&s<6?"Nuit courte : séance plus légère, ou repos.":S.done[T()]?"Séance faite, pense à bien manger et à bien dormir.":"Tu peux t’entraîner normalement aujourd’hui."}
function mac(d,c){const m=(S.meals[d]||[]).reduce((a,x)=>x.m?[a[0]+x.m[0],a[1]+x.m[1],a[2]+x.m[2]]:a,[0,0,0]),g=c?Math.round((c.kcal-4*c.P-9*c.L)/4):0;return`Protéines ${m[0]}${c?"/"+c.P:""} g · Glucides ${m[1]}${c?"/"+g:""} g · Lipides ${m[2]}${c?"/"+c.L:""} g`}
function photo(f){if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement("canvas"),w=360;c.width=w;c.height=Math.round(im.height*w/im.width);c.getContext("2d").drawImage(im,0,0,c.width,c.height);S.photos.push({d:T(),img:c.toDataURL("image/jpeg",.6)});sv();render();toast("Photo ajoutée")};im.src=r.result};r.readAsDataURL(f)}
function calc(){const p=S.p;if(!p.w||!p.h||!p.a)return null;const b=10*p.w+6.25*p.h-5*p.a+(p.s==="h"?5:-161);return{kcal:Math.round(b*p.act+({perte:-400,maintien:0,prise:300}[p.obj])),eau:Math.round(p.w*35),P:Math.round(p.w*(p.obj==="prise"?2:1.8)),L:Math.round(p.w*.9)}}
const kc=d=>(S.meals[d]||[]).reduce((a,m)=>a+m.k,0);
function chart(pts,u){if(pts.length<2)return`<p class="sub">Ajoute au moins 2 valeurs pour voir la courbe.</p>`;
const v=pts.map(p=>p.v),lo=Math.min(...v),hi=Math.max(...v),r=hi-lo||1,x=i=>30+i*(270/(pts.length-1)),y=a=>110-(a-lo)/r*90;
return`<svg class="ch" viewBox="0 0 320 135" role="img" aria-label="Courbe d’évolution"><polyline fill="none" stroke="var(--pl)" stroke-width="2.5" points="${pts.map((p,i)=>x(i)+","+y(p.v)).join(" ")}"/>${pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.v)}" r="3.5" fill="var(--pl)"/>`).join("")}<text x="2" y="24" font-size="11" fill="var(--mu)">${hi}</text><text x="2" y="114" font-size="11" fill="var(--mu)">${lo}</text><text x="30" y="130" font-size="11" fill="var(--mu)">${pts[0].d.slice(5)}</text><text x="300" y="130" font-size="11" text-anchor="end" fill="var(--mu)">${pts[pts.length-1].d.slice(5)} (${u})</text></svg>`}
function pref(n){const p=S.prefs[n]||{};const f=(id,l,v,s)=>`<div style="flex:1;min-width:70px"><span class="lab">${l}</span><input id="${id}" type="number" inputmode="decimal" step="${s}" value="${v??""}"></div>`;
return`<div class="row" style="align-items:flex-end">${f("pk","Poids (kg)",p.kg,.5)}${f("pb","Cran du banc",p.banc,1)}${f("ps","Séries",p.ser,1)}${f("pr","Répétitions",p.rep,1)}</div><button data-a="pref" data-n="${esc(n)}" style="margin-top:10px;width:100%">Enregistrer mes préférences</button>`}
function home(){const c=calc(),d=T(),pl=S.plan.filter(x=>x.length).length,dn=wk().filter(x=>S.done[x]).length,ex=S.plan[di()],w=S.water[d]||0,k=kc(d);
return`<h1>Salut 👋</h1><p class="sub">${new Date().toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"})}</p>
<div class="card"><span class="lab" style="margin:0">Séances cette semaine</span><div class="big">${dn} / ${pl}</div><div class="bar"><i style="width:${pl?Math.min(100,dn/pl*100):0}%"></i></div></div>
<div class="card ${S.done[d]?"":"today"}"><div class="row sp"><h2>Séance du jour</h2>${S.done[d]?`<span class="ok">Faite ✓</span>`:""}</div>${ex.length?`<p>${ex.map(esc).join(" · ")}</p>`:`<p class="sub">Jour de repos (ou planning à remplir dans Séance).</p>`}</div>
<div class="card"><h2>Calories</h2>${c?`<div class="big">${k} <small style="font-size:20px">/ ${c.kcal} kcal</small></div><div class="bar"><i style="width:${Math.min(100,k/c.kcal*100)}%"></i></div>`:`<p class="sub">Renseigne tes mesures dans Compte pour calculer ton besoin.</p>`}</div>
<div class="card"><h2>Sommeil et récupération</h2><p>${adv()}</p><div class="row"><input id="sl" type="number" inputmode="decimal" step="0.5" placeholder="Heures dormies cette nuit" value="${S.sleep[d]||""}"><button data-a="sleep">Enregistrer</button></div></div>
<div class="card"><h2>Eau</h2>${c?`<div class="big">${(w/1000).toFixed(2)} <small style="font-size:20px">/ ${(c.eau/1000).toFixed(1)} L</small></div><div class="bar"><i style="width:${Math.min(100,w/c.eau*100)}%"></i></div>`:`<p class="sub">Objectif calculé avec ton poids (Compte).</p>`}<div class="row" style="margin-top:10px"><button class="o" data-a="water" data-n="250">+ 1 verre (250 ml)</button><button class="g" data-a="water" data-n="-250">Annuler</button><button data-a="wok" style="margin-left:auto">${S.wok[d]?"✓ Eau bue":"J’ai bu mon eau"}</button></div></div>`}
function seance(){const d=T(),i=di(),opts=all().map(e=>`<option>${esc(e[0])}</option>`).join("");
let h=`<h1>Séances</h1><p class="sub">Planning de la semaine, modifiable.</p><div class="card ${S.done[d]?"":"today"}"><h2>Aujourd’hui · ${D[i]}</h2>`;
const ex=S.plan[i];
if(!ex.length)h+=`<p class="sub">Aucun exercice prévu. Ajoute-en dans le planning ci-dessous.</p>`;
ex.forEach((n,j)=>{const p=S.prefs[n];h+=`<button class="item" data-a="open" data-j="${j}"><span>${esc(n)}</span><small>${p&&p.kg?p.kg+" kg · "+(p.ser||"?")+"×"+(p.rep||"?"):"à régler"}</small></button>${open===j?`<div style="padding:4px 0 12px">${pref(n)}</div>`:""}`});
h+=ex.length?`<button data-a="done" style="width:100%;margin-top:12px" ${S.done[d]?"class=o":""}>${S.done[d]?"✓ Séance faite (annuler)":"J’ai fait ma séance"}</button>`:"";
h+=`</div><div class="card"><h2>Programmes tout faits</h2><p class="sub">Remplace ton planning actuel.</p>${Object.keys(PG).map(n=>`<button class="o" data-a="prog" data-n="${n}" style="margin:0 6px 6px 0">${n}</button>`).join("")}</div><h2 style="margin:18px 0 8px">Planning</h2>`;
h+=`<div class="week-strip">`;D.forEach((n,k)=>{h+=`<div class="card day-card"><div class="row sp"><h3>${n}</h3>${S.plan[k].length?`<button class="g" data-a="clr" data-k="${k}">Retirer la séance</button>`:`<span class="sub">Repos</span>`}</div>${S.plan[k].map((x,j)=>`<span class="chip">${esc(x)}<button class="g" data-a="rm" data-k="${k}" data-j="${j}" aria-label="Retirer ${esc(x)}">✕</button></span>`).join("")}<div class="row" style="margin-top:8px"><select id="s${k}">${opts}</select><button data-a="add" data-k="${k}">Ajouter</button></div></div>`});h+=`</div>`;return h}
function exos(){let h=`<h1>Exercices</h1><p class="sub">Touche un exercice pour l’explication et tes préférences. Vidéos à venir.</p><div class="card">`;
all().forEach((e,i)=>{h+=`<button class="item" data-a="open" data-j="${i}"><span>${esc(e[0])}</span><small>${esc(e[1])}</small></button>${open===i?`<div style="padding:4px 0 12px"><p>${esc(e[2])}</p>${pref(e[0])}</div>`:""}`});
return h+`</div><div class="card"><h3>Créer mon exercice</h3><div class="row" style="margin-top:8px"><input id="cx" placeholder="Nom"><button data-a="cx">Créer</button></div></div>`}
function food(){const d=T(),c=calc(),ms=S.meals[d]||[];
